name: identiflora
description: "The Identiflora app is a plant identification app for those knowledgable of flora."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.3
  permission_handler: ^12.0.1
  camera: ^0.12.0+1
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.2.1
  connectivity_plus: ^7.1.0
  google_sign_in: ^7.2.0
  tflite_flutter: ^0.12.1
  image: ^4.1.7
  http: ^1.0.0
  flutter_dotenv: ^6.0.0
  settings_ui: 2.0.2
  cupertino_icons: ^1.0.9
  geolocator: ^14.0.2
  provider: ^6.1.5+1
  intl: ^0.20.2
  confetti: ^0.8.0
  google_maps_flutter: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/homepage/
    - assets/badge/
    - assets/model/
    - assets/plant_images/identiflora_one_image_per_plant/
    - .env.development
    - .env.production

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/Identiflora_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/Identiflora_logo.png"